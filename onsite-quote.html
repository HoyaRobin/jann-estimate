<html lang="zh-Hant">
<head>

<title>橘子班 到府安裝報價</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink:#232323;
    --paper:#f2ede4;
    --panel:#ffffff;
    --brass:#a9813f;
    --brass-dark:#8a6a30;
    --line:#dcd4c4;
    --good:#3c6e52;
    --warn:#a94438;
    --sub:#726d5c;
    --sub2:#8a836c;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
  }

  .header{
    position:relative;
    background:#26241f;
    color:#f2ede4;
    padding:38px 24px 34px;
    overflow:hidden;
  }
  .header .slats{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(242,237,228,0.06) 0px,
      rgba(242,237,228,0.06) 2px,
      transparent 2px,
      transparent 16px
    );
    pointer-events:none;
  }
  .header-inner{ position:relative; max-width:760px; margin:0 auto; }
  .eyebrow{ font-size:12px; letter-spacing:0.18em; color:var(--brass); font-weight:700; }
  h1{ font-family:'Noto Serif TC', serif; font-size:26px; margin:6px 0 4px; font-weight:700; }
  .sub{ font-size:13.5px; color:#c9c2b2; }

  .wrap{ max-width:760px; margin:0 auto; padding:28px 24px 80px; }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:24px;
    margin-bottom:20px;
  }
  .card h2{
    font-size:14px; margin:0 0 16px; font-weight:700;
    display:flex; align-items:center; gap:8px; color:#54503f;
  }
  .card h2::before{ content:""; width:3px; height:14px; background:var(--brass); display:inline-block; border-radius:2px; }

  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .field{ flex:1; min-width:110px; }
  label{ display:block; font-size:12.5px; color:var(--sub); margin-bottom:6px; }
  input[type=number], select{
    width:100%; padding:11px 12px; border:1px solid #cfc7b2; border-radius:5px;
    font-size:15px; background:#fbfaf7; color:var(--ink);
  }
  input[type=number]:focus, select:focus{ outline:none; border-color:var(--brass); }

  .seg{
    display:flex; gap:8px; margin-top:6px;
  }
  .seg label{
    flex:1; margin:0; text-align:center; padding:10px 6px; border:1px solid #cfc7b2; border-radius:5px;
    background:#fbfaf7; cursor:pointer; font-size:14px; font-weight:700; color:var(--sub); transition:all .12s ease;
  }
  .seg input{ display:none; }
  .seg input:checked + span{ color:#fff; }
  .seg label:has(input:checked){ background:var(--brass); border-color:var(--brass); }
  .seg label:has(input:checked) span{ color:#fff; }

  button.primary{
    padding:11px 18px; background:var(--brass); color:#fff;
    border:none; border-radius:5px; font-size:14px; font-weight:700; cursor:pointer;
    letter-spacing:0.02em; transition:background 0.15s ease;
  }
  button.primary:hover{ background:var(--brass-dark); }

  button.ghost{
    padding:9px 14px; background:transparent; border:1px solid var(--brass);
    color:var(--brass-dark); border-radius:5px; font-size:13px; cursor:pointer; font-weight:700;
  }
  button.ghost:hover{ background:#f6efe0; }

  button.danger{
    padding:7px 12px; background:transparent; border:1px solid #d8beb8;
    color:var(--warn); border-radius:5px; font-size:12.5px; cursor:pointer; font-weight:700;
  }
  button.danger:hover{ background:#fbf0ee; }

  .window-card{
    border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:16px; background:#fdfcfa;
  }
  .window-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  }
  .window-title{ font-weight:700; font-size:14.5px; color:#54503f; }

  .match-box{
    margin-top:14px; padding:12px 14px; background:#f6f2e8; border:1px dashed #d9cfb4; border-radius:5px;
    font-size:13px; color:#5c5642;
  }
  .match-box.warn{ background:#fbf0ee; border-color:#d8beb8; color:var(--warn); }
  .match-box b{ color:var(--brass-dark); }

  .style-row{
    display:flex; gap:10px; align-items:flex-end; margin-top:10px; padding-top:10px; border-top:1px solid #eee8db;
  }
  .style-row:first-of-type{ border-top:none; margin-top:0; padding-top:0; }
  .style-row .field{ flex:3; }
  .style-row .field.qty{ flex:1; min-width:70px; }
  .style-row .price-tag{
    flex:0 0 auto; font-size:12.5px; color:var(--sub2); min-width:78px; text-align:right; padding-bottom:12px;
  }

  .add-style-btn{ margin-top:12px; }

  .summary-line{
    display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px dashed #eee8db;
  }
  .summary-line.total{
    font-size:16px; font-weight:700; border-bottom:none; border-top:1px solid var(--line);
    margin-top:8px; padding-top:12px; color:var(--brass-dark);
  }
  .summary-line .lbl{ color:var(--sub); }
  .summary-line.total .lbl{ color:var(--ink); }

  .toggle-row{
    display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13.5px; color:var(--sub);
  }
  .toggle-row input{ width:17px; height:17px; }

  .output{
    white-space:pre-wrap; background:#fbfaf7; border:1px dashed #cfc7b2; border-radius:5px;
    padding:16px; font-size:14px; min-height:80px; color:var(--ink); margin-top:14px;
  }
  .output.empty{ color:#a49d89; font-size:13.5px; }

  .note{ font-size:12px; color:var(--sub2); margin-top:10px; line-height:1.7; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn-row.right{ justify-content:flex-end; }

  select:disabled{ color:#b3ab97; background:#f2efe6; }

<div class="header">
  <div class="slats"></div>
  <div class="header-inner">
    <div class="eyebrow">內部工具 · 橘子班 · 門市到府報價</div>
    <h1>到府安裝正式報價試算</h1>
    <div class="sub">依片幅／款式／片數精算，含安裝與加價項目，未稅金額自動加稅 5%</div>
  </div>
</div>

<div class="wrap">

  <div id="windowsContainer"></div>

  <div class="btn-row">
    <button class="primary" onclick="addWindow()">＋ 新增一組窗（軌道）</button>
  </div>

  <div class="card">
    <h2>整單加價項目</h2>
    <div class="toggle-row">
      <input type="checkbox" id="noElevator" onchange="renderSummary()">
      <label for="noElevator" style="margin:0;">無電梯（整單 +500）</label>
    </div>
    <div class="note">
      安裝費 $3,600 與無電梯加價，預設整張訂單只收一次（不是每窗都收）。若貴公司規則是每窗都要收安裝費，請告訴我，我再改邏輯。
    </div>
  </div>

  <div class="card">
    <h2>報價明細</h2>
    <div id="summaryBox"></div>
    <div class="output empty" id="outputText">尚未輸入任何資料</div>
    <div class="btn-row right">
      <button class="ghost" id="copyBtn" onclick="copyOutput()">複製報價文字</button>
    </div>
  </div>

</div>

const INSTALL_FEE = 3600;
const EXTRA_TRACK_FEE = 2000; // 單組軌道片數 >= 8
const EXTRA_WINDOW_FEE = 1500; // 第2組窗起，每窗
const NO_ELEVATOR_FEE = 500;
const TAX_RATE = 1.05;

/* ============ 狀態 ============ */
let windows = [];
let windowSeq = 0;
let styleSeq = 0;

function newWindow(){
  windowSeq++;
  return {
    id: windowSeq,
    series: '',
    width: '',
    height: '',
    styles: [ newStyleRow() ]
  };
}
function newStyleRow(){
  styleSeq++;
  return { id: styleSeq, fabricKey: '', qty: '' };
}

function addWindow(){
  windows.push(newWindow());
  render();
}
function removeWindow(id){
  windows = windows.filter(w => w.id !== id);
  render();
}
function addStyleRow(winId){
  const w = windows.find(w => w.id === winId);
  w.styles.push(newStyleRow());
  render();
}
function removeStyleRow(winId, styleId){
  const w = windows.find(w => w.id === winId);
  w.styles = w.styles.filter(s => s.id !== styleId);
  if (w.styles.length === 0) w.styles.push(newStyleRow());
  render();
}

/* ============ 計算邏輯 ============ */

// 高度 → 級距 (240 / 300 / null=超過)
function heightTier(h){
  if (h === '' || h === null || isNaN(h)) return null;
  if (h <= 240) return 240;
  if (h <= 300) return 300;
  return 'over';
}

// 找軌道規格：同系列中，遮蔽寬度區間涵蓋輸入寬度，取片數最少者
function matchTrack(series, width){
  if (!series || !width) return null;
  const candidates = TRACKS.filter(t => t.series === series && width >= t.minW && width <= t.maxW);
  if (candidates.length === 0) return null;
  candidates.sort((a,b) => a.pieces - b.pieces);
  return candidates[0];
}

function fabricsFor(series, tier){
  if (!series || !tier || tier === 'over') return [];
  return FABRICS.filter(f => f.series === series && f.tier === tier);
}

function fabricLabel(f){
  const priceTxt = f.avail === 'X' ? '無此款' : ('$' + f.price.toLocaleString());
  return `${f.name}（${f.type} / ${f.code}） ${priceTxt}`;
}

/* ============ 渲染 ============ */

function render(){
  renderWindows();
  renderSummary();
}

function renderWindows(){
  const c = document.getElementById('windowsContainer');
  c.innerHTML = '';
  windows.forEach((w, idx) => {
    const div = document.createElement('div');
    div.className = 'window-card';

    const tier = heightTier(parseFloat(w.height));
    const track = matchTrack(w.series, parseFloat(w.width));
    const avail = fabricsFor(w.series, tier);

    let matchHtml = '';
    if (!w.series) {
      matchHtml = `<div class="match-box">請先選擇單片寬幅</div>`;
    } else if (w.width === '' || w.height === '') {
      matchHtml = `<div class="match-box">請輸入寬度與高度</div>`;
    } else if (tier === 'over') {
      matchHtml = `<div class="match-box warn">高度超過300cm，需人工評估報價（可能需加裝支架）</div>`;
    } else if (!track) {
      matchHtml = `<div class="match-box warn">此寬幅系列找不到涵蓋此寬度的軌道規格，請人工報價</div>`;
    } else {
      matchHtml = `<div class="match-box">
        比對規格：<b>${w.series}系列 ${track.pieces}片</b>（遮蔽寬度 ${track.minW}-${track.maxW}cm）
        ／軌道未稅價 <b>$${track.price.toLocaleString()}</b>
        ${track.pieces >= 8 ? '<br>※ 此組片數≥8，加收軌道安裝費 $2,000' : ''}
      </div>`;
    }

    const stylesHtml = w.styles.map(s => {
      const options = avail.map(f => {
        const key = `${f.name}|${f.code}`;
        const disabled = f.avail === 'X' ? 'disabled' : '';
        const selected = s.fabricKey === key ? 'selected' : '';
        return `<option value="${key}" ${disabled} ${selected}>${fabricLabel(f)}</option>`;
      }).join('');

      const chosen = avail.find(f => `${f.name}|${f.code}` === s.fabricKey);
      const lineTotal = (chosen && chosen.avail === 'V' && s.qty) ? chosen.price * Number(s.qty) : 0;

      return `
        <div class="style-row">
          <div class="field">
            <label>款式</label>
            <select onchange="updateStyle(${w.id},${s.id},'fabricKey',this.value)" ${avail.length===0?'disabled':''}>
              <option value="">－ 請選擇款式 －</option>
              ${options}
            </select>
          </div>
          <div class="field qty">
            <label>片數</label>
            <input type="number" min="0" value="${s.qty}" placeholder="片數"
              onchange="updateStyle(${w.id},${s.id},'qty',this.value)">
          </div>
          <div class="price-tag">${lineTotal ? '$'+lineTotal.toLocaleString() : ''}</div>
          <button class="danger" onclick="removeStyleRow(${w.id},${s.id})">移除</button>
        </div>`;
    }).join('');

    div.innerHTML = `
      <div class="window-head">
        <div class="window-title">窗 ${idx+1}${idx>0 ? '（第 '+(idx+1)+' 組軌道 +$1,500）' : ''}</div>
        ${windows.length > 1 ? `<button class="danger" onclick="removeWindow(${w.id})">刪除此窗</button>` : ''}
      </div>

      <div class="row">
        <div class="field" style="flex:1.4;">
          <label>單片寬幅</label>
          <div class="seg">
            ${['40','60','80'].map(v => `
              <label>
                <input type="radio" name="series-${w.id}" value="${v}" ${w.series===v?'checked':''}
                  onchange="updateWindow(${w.id},'series','${v}')">
                <span>${v}寬</span>
              </label>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>遮蔽寬度 (cm)</label>
          <input type="number" value="${w.width}" placeholder="例如 266"
            onchange="updateWindow(${w.id},'width',this.value)">
        </div>
        <div class="field">
          <label>遮蔽高度 (cm)</label>
          <input type="number" value="${w.height}" placeholder="例如 260"
            onchange="updateWindow(${w.id},'height',this.value)">
        </div>
      </div>

      ${matchHtml}

      <div style="margin-top:16px;">
        <label style="margin-bottom:10px;">款式選擇（可混搭多款，片數不需等於軌道總片數）</label>
        ${stylesHtml}
        <button class="ghost add-style-btn" onclick="addStyleRow(${w.id})">＋ 新增一款布</button>
      </div>
    `;
    c.appendChild(div);
  });
}

function updateWindow(id, key, val){
  const w = windows.find(w => w.id === id);
  w[key] = (key === 'width' || key === 'height') ? val : val;
  render();
}
function updateStyle(winId, styleId, key, val){
  const w = windows.find(w => w.id === winId);
  const s = w.styles.find(s => s.id === styleId);
  s[key] = val;
  render();
}

/* ============ 計算總價與明細文字 ============ */

function computeAll(){
  let trackSubtotal = 0;
  let fabricSubtotal = 0;
  let extraTrackFeeTotal = 0;
  let windowLines = [];
  let hasError = false;
  let validWindowCount = 0;

  windows.forEach((w, idx) => {
    const tier = heightTier(parseFloat(w.height));
    const track = matchTrack(w.series, parseFloat(w.width));
    if (!w.series || w.width==='' || w.height==='' || tier==='over' || !track){
      hasError = true;
      return;
    }
    validWindowCount++;
    trackSubtotal += track.price;
    if (track.pieces >= 8) extraTrackFeeTotal += EXTRA_TRACK_FEE;

    let styleLines = [];
    w.styles.forEach(s => {
      const avail = fabricsFor(w.series, tier);
      const chosen = avail.find(f => `${f.name}|${f.code}` === s.fabricKey);
      if (chosen && chosen.avail === 'V' && s.qty && Number(s.qty) > 0){
        const lineTotal = chosen.price * Number(s.qty);
        fabricSubtotal += lineTotal;
        styleLines.push(`　${chosen.name}（${chosen.code}） x ${s.qty}片　$${lineTotal.toLocaleString()}`);
      }
    });

    windowLines.push({
      idx: idx+1,
      series: w.series,
      width: w.width,
      height: w.height,
      trackSpec: `${w.series}系列 ${track.pieces}片（${track.minW}-${track.maxW}cm）`,
      trackPrice: track.price,
      extraTrack: track.pieces >= 8,
      styleLines
    });
  });

  const extraWindowFeeTotal = validWindowCount > 1 ? (validWindowCount - 1) * EXTRA_WINDOW_FEE : 0;
  const noElevator = document.getElementById('noElevator').checked;
  const elevatorFee = noElevator ? NO_ELEVATOR_FEE : 0;

  const preTax = trackSubtotal + fabricSubtotal + INSTALL_FEE + extraTrackFeeTotal + extraWindowFeeTotal + elevatorFee;
  const total = Math.round(preTax * TAX_RATE);

  return {
    hasError, validWindowCount, windowLines,
    trackSubtotal, fabricSubtotal, extraTrackFeeTotal, extraWindowFeeTotal,
    elevatorFee, installFee: INSTALL_FEE, preTax, total
  };
}

function renderSummary(){
  const r = computeAll();
  const box = document.getElementById('summaryBox');
  const out = document.getElementById('outputText');

  if (r.validWindowCount === 0){
    box.innerHTML = '<div class="note">尚未有完整的資料</div>';
    out.textContent = '尚未輸入任何資料';
    out.classList.add('empty');
    return;
  }

  box.innerHTML = `
    <div class="summary-line"><span class="lbl">軌道小計（${r.validWindowCount}組）</span><span>$${r.trackSubtotal.toLocaleString()}</span></div>
    <div class="summary-line"><span class="lbl">布料小計</span><span>$${r.fabricSubtotal.toLocaleString()}</span></div>
    <div class="summary-line"><span class="lbl">安裝費</span><span>$${r.installFee.toLocaleString()}</span></div>
    ${r.extraTrackFeeTotal ? `<div class="summary-line"><span class="lbl">軌道片數≥8 加收</span><span>$${r.extraTrackFeeTotal.toLocaleString()}</span></div>` : ''}
    ${r.extraWindowFeeTotal ? `<div class="summary-line"><span class="lbl">多窗加收（第2組起 x $1,500）</span><span>$${r.extraWindowFeeTotal.toLocaleString()}</span></div>` : ''}
    ${r.elevatorFee ? `<div class="summary-line"><span class="lbl">無電梯加收</span><span>$${r.elevatorFee.toLocaleString()}</span></div>` : ''}
    <div class="summary-line"><span class="lbl">未稅合計</span><span>$${r.preTax.toLocaleString()}</span></div>
    <div class="summary-line total"><span class="lbl">含稅總價 (×1.05)</span><span>$${r.total.toLocaleString()}</span></div>
    ${r.hasError ? '<div class="note" style="color:var(--warn);">＊有資料尚未完整或超出規格範圍，未列入計算</div>' : ''}
  `;

  let text = `捷安片簾 到府安裝報價\n\n`;
  r.windowLines.forEach(wl => {
    text += `【窗${wl.idx}】W${wl.width} x H${wl.height} cm\n`;
    text += `　軌道：${wl.trackSpec}　$${wl.trackPrice.toLocaleString()}${wl.extraTrack ? '（含片數加收）' : ''}\n`;
    if (wl.styleLines.length){
      text += wl.styleLines.join('\n') + '\n';
    } else {
      text += `　（尚未選擇布款）\n`;
    }
    text += `\n`;
  });
  text += `安裝費：$${r.installFee.toLocaleString()}\n`;
  if (r.extraTrackFeeTotal) text += `軌道片數≥8加收：$${r.extraTrackFeeTotal.toLocaleString()}\n`;
  if (r.extraWindowFeeTotal) text += `多窗加收：$${r.extraWindowFeeTotal.toLocaleString()}\n`;
  if (r.elevatorFee) text += `無電梯加收：$${r.elevatorFee.toLocaleString()}\n`;
  text += `\n未稅合計：$${r.preTax.toLocaleString()}\n`;
  text += `含稅總價：$${r.total.toLocaleString()}（未稅金額 ×1.05）\n`;
  text += `\n＊實際報價以現場丈量與最終確認款式後，業務估價為準，（尚未計算降高度、輕鋼架補強）;

  out.textContent = text;
  out.classList.remove('empty');
}

function copyOutput(){
  const out = document.getElementById('outputText');
  if (out.classList.contains('empty')) return;
  navigator.clipboard.writeText(out.textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    const original = btn.textContent;
    btn.textContent = '已複製 ✓';
    setTimeout(() => { btn.textContent = original; }, 1800);
  });
}

/* ============ 初始化 ============ */
windows.push(newWindow());
render();
</script>

</body>
</html>
